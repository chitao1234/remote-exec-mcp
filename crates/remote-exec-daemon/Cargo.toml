[package]
build = "build.rs"
name = "remote-exec-daemon"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["tls", "winpty"]
test-support = []
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls"]
winpty = ["remote-exec-host/winpty"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
remote-exec-host = { path = "../remote-exec-host", default-features = false }
remote-exec-proto = { path = "../remote-exec-proto" }
remote-exec-util = { path = "../remote-exec-util" }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
encoding_rs = { workspace = true }
gethostname = { workspace = true }
image = { workspace = true }
portable-pty = { workspace = true }
remote-exec-pki = { path = "../remote-exec-pki" }
remote-exec-test-support = { path = "../remote-exec-test-support" }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "exec_rpc"
path = "tests/exec_rpc/mod.rs"
