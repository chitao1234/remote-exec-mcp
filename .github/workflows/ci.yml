name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

  cpp-fmt:
    name: C++ fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          apt_get() {
            local command_timeout="$1"
            shift
            sudo timeout --signal=TERM --kill-after=30s "$command_timeout" \
              env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=60 \
              "$@"
          }
          apt_get 5m update
          apt_get 10m install -y clang-format

      - name: Check formatting
        run: crates/remote-exec-daemon-cpp/scripts/clang_format.sh check

  rust-test:
    name: Rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Set up MSVC for Rust C++ integration tests
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust-test-nodebug

      - name: Run tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          REMOTE_EXEC_CPP_DAEMON: ${{ github.workspace }}/crates/remote-exec-daemon-cpp/build/remote-exec-daemon-cpp
        run: |
          set -eu
          cpp_status=0
          rust_status=0

          set +e
          make -k -C crates/remote-exec-daemon-cpp all-posix
          cpp_status=$?

          cargo test --workspace --locked --no-fail-fast
          rust_status=$?
          set -e

          printf 'C++ build status: %s\n' "$cpp_status"
          printf 'Rust test status: %s\n' "$rust_status"

          if [ "$cpp_status" -ne 0 ] || [ "$rust_status" -ne 0 ]; then
            exit 1
          fi

      - name: Run tests
        if: runner.os == 'Windows'
        shell: cmd
        env:
          REMOTE_EXEC_CPP_DAEMON: ${{ github.workspace }}\crates\remote-exec-daemon-cpp\build\msvc-native\remote-exec-daemon-cpp-msvc.exe
        run: |
          @echo off
          setlocal EnableExtensions
          set "cpp_status=0"
          set "rust_status=0"

          nmake /K /f crates\remote-exec-daemon-cpp\NMakefile all-msvc-native TLS=off
          if errorlevel 1 set "cpp_status=%errorlevel%"

          cargo test --workspace --locked --no-fail-fast
          if errorlevel 1 set "rust_status=%errorlevel%"

          echo C++ build status: %cpp_status%
          echo Rust test status: %rust_status%

          if not "%cpp_status%"=="0" exit /b 1
          if not "%rust_status%"=="0" exit /b 1

  rust-test-no-default-features:
    name: Rust no-default-features (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run no-default-features tests
        shell: bash
        run: |
          set -eu
          broker_status=0
          daemon_status=0
          host_status=0

          set +e
          cargo test -p remote-exec-broker --no-default-features --tests --locked --no-fail-fast
          broker_status=$?

          cargo test -p remote-exec-daemon --no-default-features --tests --locked --no-fail-fast
          daemon_status=$?

          cargo test -p remote-exec-host --no-default-features --tests --locked --no-fail-fast
          host_status=$?
          set -e

          printf 'broker status: %s\n' "$broker_status"
          printf 'daemon status: %s\n' "$daemon_status"
          printf 'host status: %s\n' "$host_status"

          if [ "$broker_status" -ne 0 ] || [ "$daemon_status" -ne 0 ] || [ "$host_status" -ne 0 ]; then
            exit 1
          fi

  rust-clippy:
    name: Rust clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-clippy-no-default-features:
    name: Rust clippy no-default-features (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run broker clippy without default features
        run: cargo clippy -p remote-exec-broker --no-default-features --all-targets --locked -- -D warnings

      - name: Run daemon clippy without default features
        run: cargo clippy -p remote-exec-daemon --no-default-features --all-targets --locked -- -D warnings

      - name: Run host clippy without default features
        run: cargo clippy -p remote-exec-host --no-default-features --all-targets --locked -- -D warnings

  cpp-posix:
    name: C++ daemon POSIX (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache C++ build outputs
        uses: actions/cache@v4
        with:
          path: crates/remote-exec-daemon-cpp/build
          key: cpp-posix-${{ runner.os }}-${{ hashFiles('crates/remote-exec-daemon-cpp/**', 'winptyrs/**', '.gitmodules') }}
          restore-keys: |
            cpp-posix-${{ runner.os }}-
            cpp-${{ runner.os }}-

      - name: Install Linux C++ dependencies
        run: |
          apt_get() {
            local command_timeout="$1"
            shift
            sudo timeout --signal=TERM --kill-after=30s "$command_timeout" \
              env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=60 \
              "$@"
          }
          apt_get 5m update
          apt_get 10m install -y g++ make

      - name: Run POSIX C++ checks
        shell: bash
        run: |
          make -k -j"$(nproc)" -C crates/remote-exec-daemon-cpp BUILD_DIR=build/ci-posix check-posix

  cpp-windows-cross:
    name: C++ daemon Windows cross (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2000
            make_target: check-windows-2000
            build_dir: build/ci-windows-2000
          - name: NT 4.0 Winsock 1
            make_target: check-windows-nt4-ws1
            build_dir: build/ci-windows-nt4-ws1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache OpenSSL source archives
        uses: actions/cache@v4
        with:
          path: crates/remote-exec-daemon-cpp/.cache/openssl-sources
          key: openssl-sources-${{ runner.os }}-${{ hashFiles('crates/remote-exec-daemon-cpp/mk/openssl.mk', 'crates/remote-exec-daemon-cpp/scripts/prepare_openssl.sh') }}

      - name: Cache C++ build outputs
        uses: actions/cache@v4
        with:
          path: crates/remote-exec-daemon-cpp/build
          key: cpp-windows-cross-${{ matrix.make_target }}-${{ runner.os }}-${{ hashFiles('crates/remote-exec-daemon-cpp/**', 'winptyrs/**', '.gitmodules') }}
          restore-keys: |
            cpp-windows-cross-${{ matrix.make_target }}-${{ runner.os }}-
            cpp-${{ runner.os }}-

      - name: Install Linux C++ dependencies
        run: |
          sudo dpkg --add-architecture i386
          apt_get() {
            local command_timeout="$1"
            shift
            sudo timeout --signal=TERM --kill-after=30s "$command_timeout" \
              env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=60 \
              "$@"
          }
          apt_get 5m update
          apt_get 15m install -y g++ make g++-mingw-w64-i686 g++-mingw-w64-x86-64 wine wine32:i386

      - name: Run Windows C++ cross checks
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          MAKE_TARGET: ${{ matrix.make_target }}
          OPENSSL_SOURCE_CACHE_DIR: ${{ github.workspace }}/crates/remote-exec-daemon-cpp/.cache/openssl-sources
        run: |
          make -k -j"$(nproc)" -C crates/remote-exec-daemon-cpp \
            BUILD_DIR="${BUILD_DIR}" \
            OPENSSL_SOURCE_CACHE_DIR="${OPENSSL_SOURCE_CACHE_DIR}" \
            "${MAKE_TARGET}"

  cpp-msvc:
    name: C++ daemon MSVC (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache C++ build outputs
        uses: actions/cache@v4
        with:
          path: crates/remote-exec-daemon-cpp/build
          key: cpp-msvc-${{ runner.os }}-${{ hashFiles('crates/remote-exec-daemon-cpp/**', 'winptyrs/**', '.gitmodules') }}
          restore-keys: |
            cpp-msvc-${{ runner.os }}-
            cpp-${{ runner.os }}-

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Run Windows C++ checks
        shell: cmd
        run: |
          nmake /K /f crates\remote-exec-daemon-cpp\NMakefile check-msvc-native TLS=off
