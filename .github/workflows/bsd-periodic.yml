name: BSD Periodic CI

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  bsd-test:
    name: BSD test (${{ matrix.os.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BSD_NAME: ${{ matrix.os.name }}
      BSD_RUST_SETUP: ${{ matrix.os.rust_setup }}
      BSD_TEST_USER: ci

    strategy:
      fail-fast: false
      matrix:
        os:
          - label: FreeBSD
            name: freebsd
            release: "15.0"
            rust_setup: rustup
          - label: OpenBSD
            name: openbsd
            release: "7.8"
            rust_setup: package
          - label: NetBSD
            name: netbsd
            release: "10.1"
            rust_setup: rustup
          - label: DragonFly BSD
            name: dragonflybsd
            release: "6.4.2"
            rust_setup: package
          - label: OmniOS (illumos)
            name: omnios
            release: "r151058"
            rust_setup: rustup

    defaults:
      run:
        shell: vmsh {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download rustup-init for ${{ matrix.os.label }}
        if: matrix.os.rust_setup == 'rustup'
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.os.name }}' in
            freebsd)
              rustup_target='x86_64-unknown-freebsd'
              ;;
            omnios)
              rustup_target='x86_64-unknown-illumos'
              ;;
            netbsd)
              rustup_target='x86_64-unknown-netbsd'
              ;;
            *)
              echo "unexpected rustup target: ${{ matrix.os.name }}" >&2
              exit 1
              ;;
          esac
          mkdir -p .github/bin
          curl -fsSL \
            "https://static.rust-lang.org/rustup/dist/${rustup_target}/rustup-init" \
            -o .github/bin/rustup-init
          chmod +x .github/bin/rustup-init

      - name: Start FreeBSD VM
        if: matrix.os.name == 'freebsd'
        timeout-minutes: 15
        uses: vmactions/freebsd-vm@v1
        with:
          cache-after-prepare: false
          custom-shell-name: vmsh
          envs: BSD_NAME BSD_RUST_SETUP BSD_TEST_USER CARGO_TERM_COLOR CARGO_INCREMENTAL CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG CARGO_PROFILE_TEST_DEBUG RUST_BACKTRACE
          prepare: |
            set -eu
            work_root=/var/tmp/remote-exec-bsd-ci
            cargo_home="$work_root/cargo-home"
            rustup_home="$work_root/rustup-home"
            mkdir -p "$cargo_home" "$rustup_home"
            export CARGO_HOME="$cargo_home"
            export RUSTUP_HOME="$rustup_home"
            ./.github/bin/rustup-init -y --profile minimal --default-toolchain 1.85.0
            if ! id "$BSD_TEST_USER" >/dev/null 2>&1; then
              /usr/sbin/pw useradd "$BSD_TEST_USER" -m -s /bin/sh
            fi
            chown -R "$BSD_TEST_USER" "$work_root"
          release: ${{ matrix.os.release }}
          mem: 6144
          cpu: 4
          sync: rsync

      - name: Start OpenBSD VM
        if: matrix.os.name == 'openbsd'
        timeout-minutes: 15
        uses: vmactions/openbsd-vm@v1
        with:
          cache-after-prepare: false
          custom-shell-name: vmsh
          envs: BSD_NAME BSD_RUST_SETUP BSD_TEST_USER CARGO_TERM_COLOR CARGO_INCREMENTAL CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG CARGO_PROFILE_TEST_DEBUG RUST_BACKTRACE
          prepare: |
            set -eu
            if ! command -v gmake >/dev/null 2>&1; then
              pkg_add gmake
            fi
            if ! command -v rustc >/dev/null 2>&1; then
              pkg_add rust
            fi
            work_root=/var/tmp/remote-exec-bsd-ci
            mkdir -p "$work_root"
            # The session-store test creates many child processes; keep the
            # non-root user in OpenBSD's higher-limit staff class.
            if ! id "$BSD_TEST_USER" >/dev/null 2>&1; then
              /usr/sbin/useradd -m -s /bin/sh -L staff "$BSD_TEST_USER"
            fi
            /usr/sbin/usermod -L staff "$BSD_TEST_USER"
            chown -R "$BSD_TEST_USER" "$work_root"
          release: ${{ matrix.os.release }}
          mem: 6144
          cpu: 4
          sync: rsync

      - name: Start NetBSD VM
        if: matrix.os.name == 'netbsd'
        timeout-minutes: 15
        uses: vmactions/netbsd-vm@v1
        with:
          cache-after-prepare: false
          custom-shell-name: vmsh
          envs: BSD_NAME BSD_RUST_SETUP BSD_TEST_USER CARGO_TERM_COLOR CARGO_INCREMENTAL CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG CARGO_PROFILE_TEST_DEBUG RUST_BACKTRACE
          prepare: |
            set -eu
            work_root=/var/tmp/remote-exec-bsd-ci
            cargo_home="$work_root/cargo-home"
            rustup_home="$work_root/rustup-home"
            mkdir -p "$cargo_home" "$rustup_home"
            export CARGO_HOME="$cargo_home"
            export RUSTUP_HOME="$rustup_home"
            ./.github/bin/rustup-init -y --profile minimal --default-toolchain 1.85.0
            if ! id "$BSD_TEST_USER" >/dev/null 2>&1; then
              /usr/sbin/useradd -m -s /bin/sh "$BSD_TEST_USER"
            fi
            chown -R "$BSD_TEST_USER" "$work_root"
          release: ${{ matrix.os.release }}
          mem: 6144
          cpu: 4
          sync: rsync

      - name: Start DragonFly BSD VM
        if: matrix.os.name == 'dragonflybsd'
        timeout-minutes: 15
        uses: vmactions/dragonflybsd-vm@v1
        with:
          cache-after-prepare: false
          custom-shell-name: vmsh
          envs: BSD_NAME BSD_RUST_SETUP BSD_TEST_USER CARGO_TERM_COLOR CARGO_INCREMENTAL CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG CARGO_PROFILE_TEST_DEBUG RUST_BACKTRACE
          prepare: |
            set -eu
            packages=
            if ! command -v rustc >/dev/null 2>&1; then
              packages="$packages rust"
            fi
            if [ ! -f /usr/local/include/openssl/ssl.h ]; then
              packages="$packages openssl"
            fi
            if [ -n "$packages" ]; then
              pkg install -y $packages
            fi
            work_root=/var/tmp/remote-exec-bsd-ci
            mkdir -p "$work_root"
            if ! id "$BSD_TEST_USER" >/dev/null 2>&1; then
              /usr/sbin/pw useradd "$BSD_TEST_USER" -m -s /bin/sh
            fi
            chown -R "$BSD_TEST_USER" "$work_root"
          release: ${{ matrix.os.release }}
          mem: 6144
          cpu: 4
          sync: rsync

      - name: Start OmniOS VM
        if: matrix.os.name == 'omnios'
        timeout-minutes: 15
        uses: vmactions/omnios-vm@v1
        with:
          cache-after-prepare: false
          custom-shell-name: vmsh
          envs: BSD_NAME BSD_RUST_SETUP BSD_TEST_USER CARGO_TERM_COLOR CARGO_INCREMENTAL CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG CARGO_PROFILE_TEST_DEBUG RUST_BACKTRACE
          prepare: |
            set -eu
            if ! command -v gmake >/dev/null 2>&1; then
              pkg install developer/build/gnu-make
            fi
            if ! command -v c++ >/dev/null 2>&1 && ! command -v g++ >/dev/null 2>&1; then
              pkg install build-essential
            fi
            work_root=/var/tmp/remote-exec-bsd-ci
            cargo_home="$work_root/cargo-home"
            rustup_home="$work_root/rustup-home"
            mkdir -p "$cargo_home" "$rustup_home"
            export CARGO_HOME="$cargo_home"
            export RUSTUP_HOME="$rustup_home"
            ./.github/bin/rustup-init -y --profile minimal --default-toolchain 1.85.0
            if ! id "$BSD_TEST_USER" >/dev/null 2>&1; then
              /usr/sbin/useradd -m -s /bin/sh "$BSD_TEST_USER"
            fi
            chown -R "$BSD_TEST_USER" "$work_root"
          release: ${{ matrix.os.release }}
          mem: 6144
          cpu: 4
          sync: rsync

      - name: Record guest details
        run: |
          set -eu
          uname -a
          printf 'rust setup mode: %s\n' "$BSD_RUST_SETUP"
          id "$BSD_TEST_USER"
          df -h .
          df -h /var/tmp || true

      - name: Run C++ and Rust tests on ${{ matrix.os.label }}
        run: |
          set -eu
          # vmactions rsyncs the workspace as root before each custom-shell step.
          chown -R "$BSD_TEST_USER" "$GITHUB_WORKSPACE"
          # vmactions connects as root. Keep setup privileged, then drop
          # privileges for the tests.
          su "$BSD_TEST_USER" -c 'sh -s' <<'NON_ROOT_TESTS'

          if [ "$(id -u)" -eq 0 ]; then
            echo "tests must not run as root" >&2
            exit 1
          fi
          printf 'test identity: %s (uid=%s)\n' "$(id -un)" "$(id -u)"

          ensure_make_tool() {
            case "$BSD_NAME" in
              openbsd)
                PATH="/usr/local/bin:$PATH"
                export PATH
                MAKE_CMD=gmake
                ;;
              omnios)
                MAKE_CMD=gmake
                ;;
              *)
                MAKE_CMD=make
                ;;
            esac
            export MAKE_CMD
            command -v "$MAKE_CMD" >/dev/null 2>&1
          }

          ensure_cxx_tool() {
            case "$BSD_NAME" in
              omnios)
                if command -v c++ >/dev/null 2>&1; then
                  CXX_CMD=c++
                else
                  CXX_CMD=g++
                fi
                ;;
              *)
                CXX_CMD=c++
                ;;
            esac
            export CXX_CMD
          }

          setup_rust() {
            case "$BSD_RUST_SETUP" in
              rustup)
                . "$CARGO_HOME/env"
                ;;
              package)
                ;;
              *)
                echo "unexpected rust setup mode: $BSD_RUST_SETUP" >&2
                return 1
                ;;
            esac
          }

          work_root=/var/tmp/remote-exec-bsd-ci
          cargo_home="$work_root/cargo-home"
          rustup_home="$work_root/rustup-home"
          cargo_target_dir="$work_root/target"
          cpp_build_dir="$work_root/cpp-build"
          tmp_dir="$work_root/tmp"

          mkdir -p "$cargo_home" "$rustup_home" "$cargo_target_dir" "$cpp_build_dir" "$tmp_dir"
          export CARGO_HOME="$cargo_home"
          export RUSTUP_HOME="$rustup_home"
          export CARGO_TARGET_DIR="$cargo_target_dir"
          export TMPDIR="$tmp_dir"

          ensure_make_tool
          ensure_cxx_tool
          setup_rust

          case "$BSD_NAME" in
            dragonflybsd)
              OPENSSL_ROOT=/usr/local
              CPP_TLS=openssl
              export OPENSSL_ROOT
              ;;
            *)
              CPP_TLS=auto
              ;;
          esac
          export CPP_TLS

          "$CXX_CMD" --version
          cargo --version
          rustc --version
          printf 'make command: %s\n' "$MAKE_CMD"
          "$MAKE_CMD" -v >/dev/null 2>&1 || true
          df -h "$work_root" || true

          cpp_daemon="$cpp_build_dir/remote-exec-daemon-cpp"
          cpp_status=0
          rust_status=0

          set +e
          "$MAKE_CMD" -k -C crates/remote-exec-daemon-cpp BUILD_DIR="$cpp_build_dir" HOST_CXX="$CXX_CMD" TLS="$CPP_TLS" all-posix
          cpp_status=$?
          if [ "$cpp_status" -eq 0 ]; then
            "$MAKE_CMD" -k -C crates/remote-exec-daemon-cpp BUILD_DIR="$cpp_build_dir" HOST_CXX="$CXX_CMD" TLS="$CPP_TLS" check-posix
            cpp_status=$?
          fi

          REMOTE_EXEC_CPP_DAEMON="$cpp_daemon" \
            cargo test --workspace --all-features --locked --no-fail-fast
          rust_status=$?
          set -e

          printf 'C++ status: %s\n' "$cpp_status"
          printf 'Rust status: %s\n' "$rust_status"

          if [ "$cpp_status" -ne 0 ] || [ "$rust_status" -ne 0 ]; then
            exit 1
          fi
          NON_ROOT_TESTS
